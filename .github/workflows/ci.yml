name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# CI smije samo citati sadrzaj repozitorija
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # gradlew u gitu nema oznaku izvrsne datoteke, pa je postavljamo ovdje
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest
      # Android testovi se ovdje samo prevode, za pokretanje treba emulator
      - run: ./gradlew :app:compileDebugAndroidTestKotlin
      - run: ./gradlew :app:lintDebug
      # izvjestaji se spremaju samo ako neki prethodni korak padne
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/
